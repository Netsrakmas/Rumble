name: Publish to GitHub Pages

# Pages is configured in branch mode, serving the gh-pages branch.
# This workflow keeps gh-pages in sync with the dev branch on every push,
# so the live site can never go stale.

on:
  push:
    branches: [claude/dewdrop-dynasty-level-1-8pobp4, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push current branch to gh-pages
        run: git push --force origin HEAD:gh-pages
